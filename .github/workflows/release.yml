name: Build Windows and publish on request

on:
  push:
    branches: [main]
    paths: ['Cargo.*', build.rs, LICENSE, THIRD_PARTY_NOTICES.txt, 'src/**', 'examples/**', 'assets/**', 'tools/**', 'docs/legacy-cast-rule-audit.tsv', 'docs/current-behavior-*', .github/workflows/release.yml]
  pull_request:
    paths: ['Cargo.*', build.rs, LICENSE, THIRD_PARTY_NOTICES.txt, 'src/**', 'examples/**', 'assets/**', 'tools/**', 'docs/legacy-cast-rule-audit.tsv', 'docs/current-behavior-*', .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liuxi-village-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select Windows resource compiler
        run: |
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/rc.exe" -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$compiler) { throw 'Windows SDK resource compiler missing' }
          "RC=$($compiler.FullName)" >> $env:GITHUB_ENV
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component rust-docs
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          "RUSTUP_TOOLCHAIN=1.97.1-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
      - name: Validate authoritative map
        run: |
          python tools/compile_map.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Map validation failed' }
          python -m unittest discover -s tools -p test_compile_map.py
          if ($LASTEXITCODE -ne 0) { throw 'Map tests failed' }
          python -X utf8 tools/compile_legacy_bindings.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Legacy behavior bindings are stale' }
          python -X utf8 -m unittest discover -s tools -p test_compile_legacy_bindings.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy registration boundary tests failed' }
          python -X utf8 tools/audit_cast_rules.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Behavior audit table is stale' }
          python -X utf8 tools/audit_current_behaviors.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Current producer census is stale' }
          python -X utf8 tools/collect_third_party_notices.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Third-party notices are stale' }
      - name: Test simulation and Windows adapter
        run: |
          cargo test --locked --release --lib --bins
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo run --locked --release --example village_host_probe -- target/host-proof
          if ($LASTEXITCODE -ne 0) { throw 'Native host integration failed' }
      - name: Build standalone EXE
        run: |
          cargo build --locked --release --bin liuxi-village
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          Copy-Item -LiteralPath target/release/liuxi-village.exe -Destination release-files/liuxi-village-windows-x64.exe
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.txt -Destination release-files/THIRD_PARTY_NOTICES.txt
          python -c "from pathlib import Path; p=Path('release-files'); assert (p/'THIRD_PARTY_NOTICES.txt').read_bytes() in (p/'liuxi-village-windows-x64.exe').read_bytes(), 'Missing embedded third-party notices'"
          if ($LASTEXITCODE -ne 0) { throw 'Windows EXE is missing the embedded notice' }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath release-files/liuxi-village-windows-x64.exe).Hash.ToLowerInvariant()
          "$digest  liuxi-village-windows-x64.exe" | Set-Content -Encoding utf8NoBOM -LiteralPath release-files/SHA256SUMS.txt
      - name: Publish once for this version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Version metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq liuxi-village).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to replace published files." }
          gh release create $tag release-files/liuxi-village-windows-x64.exe release-files/THIRD_PARTY_NOTICES.txt release-files/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "柳溪村 $version" --notes-file docs/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
